<!doctype html>
<html lang="en-GB" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>"
		/>
		<link rel="stylesheet" id="lily-theme" data-lily-theme-picker="theme" href="/themes/light.css" />
		<script>
			// Apply a stored theme and text size before first paint. Keys match the pickers in +layout.svelte.
			(function () {
				try {
					var theme = localStorage.getItem('epr-theme');
					if (theme && /^[a-z-]+$/.test(theme)) {
						document.documentElement.dataset.theme = theme;
						document.getElementById('lily-theme').href = '/themes/' + theme + '.css';
					}
					var size = localStorage.getItem('epr-text-size');
					if (size) document.documentElement.dataset.textSize = size;
				} catch (e) {
					// Storage unavailable: keep the defaults.
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
